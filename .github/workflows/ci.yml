name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast on known high/critical advisories in production dependencies.
      # (Added after next@16.4.0 advisories surfaced only as a build-time SecurityFatalError.)
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Validate bundled dataset
        run: npm run data:validate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (against the production build)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  evals:
    name: Python evaluation harness (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum the harness supports (tomllib); 3.12 is the version used in development.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Test and lint tools only (pinned); the harness and tasks use the standard library.
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and format check
        run: ruff check . && ruff format --check .

      - name: Validate task specifications
        run: python -m apexstint_evals validate tasks/*/

      - name: Harness and task tests
        run: python -m pytest -q

      # Every task's reference must pass and every negative control must fail exactly as declared.
      - name: Task self-tests
        run: for task in tasks/*/; do python -m apexstint_evals selftest "$task" || exit 1; done
