# Tool configuration for the evaluation harness. The harness itself uses only the standard
# library and is run in place (`python -m apexstint_evals`), so it is not packaged.
[project]
name = "apexstint-evals"
version = "0.1.0"
requires-python = ">=3.11"  # CI tests 3.11 and 3.12; development uses 3.12

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S603",  # subprocess without shell: argv lists are the point of the runner
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tasks/*/tests/**" = ["S101"]
